name: Inventário de fontes oficiais

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Consultar catálogo oficial
        run: |
          mkdir -p artifacts
          python scripts/inventariar_fontes.py
      - name: Publicar inventário
        uses: actions/upload-artifact@v4
        with:
          name: inventario-fontes-oficiais
          path: artifacts/fontes_oficiais.json
          if-no-files-found: error
          retention-days: 30
