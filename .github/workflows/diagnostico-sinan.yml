name: Diagnóstico manual do SINAN

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de notificação a consultar"
        required: true
        default: "2024"
        type: string
      max_pages:
        description: "Máximo de páginas (cada página pode ter até 1.000 registros)"
        required: true
        default: "10"
        type: string
      page_size:
        description: "Tamanho da página (1 a 1.000)"
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependência do diagnóstico
        run: python -m pip install "requests>=2.31,<3.0"
      - name: Executar diagnóstico agregado
        run: |
          python -m scripts.diagnosticar_paginacao_sinan \
            --ano "${{ inputs.ano }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --page-size "${{ inputs.page_size }}"
