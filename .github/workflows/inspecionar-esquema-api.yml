name: Inspecionar esquema das APIs oficiais

on:
  push:
    branches:
      - feat/validacao-esquema-api
      - feat/validacao-geografia-agregacoes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependência HTTP
        run: python -m pip install "requests>=2.31,<3.0"
      - name: Consultar esquema das APIs
        run: python scripts/inspecionar_esquema_api.py
